<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S2AI battle map</title>
<style>
  :root { --bg:#14161a; --panel:#1d2026; --line:#2b2f37; --ink:#e6e3da; --muted:#9a968c; --ai:#d0503c; --pl:#3c8ad0; --plan:#e8c15a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:13px/1.45 system-ui, sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { display:flex; gap:10px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
  header b { font-size:14px; margin-right:6px; }
  button, select { background:#262a32; color:var(--ink); border:1px solid #3a3f49; border-radius:4px; padding:4px 10px; font:inherit; cursor:pointer; }
  button.on { background:var(--plan); color:#1a1a1a; border-color:var(--plan); }
  #timeline { display:none; flex:1; min-width:220px; gap:8px; align-items:center; }
  #timeline input[type=range] { flex:1; min-width:120px; }
  #tlabel { font-variant-numeric:tabular-nums; min-width:70px; }
  main { flex:1; display:flex; min-height:0; }
  #map { flex:1; min-width:0; position:relative; }
  canvas { width:100%; height:100%; display:block; }
  #tip { position:absolute; pointer-events:none; background:#000c; border:1px solid #444; padding:4px 7px; border-radius:4px; font-size:12px; display:none; white-space:nowrap; }
  aside { width:400px; max-width:44vw; background:var(--panel); padding:12px 14px; overflow:auto; border-left:1px solid var(--line); }
  h2 { font-size:11px; text-transform:uppercase; color:var(--muted); margin:14px 0 5px; letter-spacing:.06em; }
  .intent { font-size:15px; color:var(--plan); }
  .muted { color:var(--muted); }
  ul { margin:0; padding-left:16px; }
  li { margin:2px 0; }
  pre { white-space:pre-wrap; margin:0; font:11.5px/1.4 ui-monospace, Consolas, monospace; color:#cfcabe; }
  .plans div { padding:3px 6px; border-radius:3px; cursor:pointer; }
  .plans div:hover { background:#262a32; }
  .plans div.cur { background:#3a3424; }
  .plans .t { color:var(--muted); font-variant-numeric:tabular-nums; display:inline-block; width:46px; }
  details summary { cursor:pointer; color:var(--muted); margin-top:8px; }
  .legend span { display:inline-block; margin-right:10px; }
  .sw { display:inline-block; width:10px; height:10px; margin-right:4px; vertical-align:-1px; }
  @media (max-width:760px) { main { flex-direction:column; } aside { width:auto; max-width:none; height:48vh; border-left:0; border-top:1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <b>S2AI</b>
  <button id="bLive" class="on">Live</button>
  <select id="pick"><option value="">History…</option></select>
  <div id="timeline">
    <button id="bPlay">▶</button>
    <select id="speed"><option>1</option><option selected>4</option><option>8</option><option>16</option></select>
    <input id="slider" type="range" min="0" max="0" step="1" value="0">
    <span id="tlabel">0s</span>
  </div>
  <span class="legend muted"><span><i class="sw" style="background:var(--ai)"></i>AI (Claude)</span><span><i class="sw" style="background:var(--pl)"></i>player</span><span><i class="sw" style="background:var(--plan)"></i>plan / controlled</span></span>
</header>
<main>
  <div id="map"><canvas id="c"></canvas><div id="tip"></div></div>
  <aside>
    <div id="title" style="font-weight:600">Waiting for a battle…</div>
    <div class="muted" id="sub"></div>
    <h2>Intent</h2><div class="intent" id="intent">–</div>
    <h2>Reasoning</h2><div id="reasoning" class="muted">–</div>
    <h2>Groups</h2><ul id="groups"></ul>
    <div id="reportBox" style="display:none"><details><summary>Report the general saw / problems</summary><pre id="report"></pre></details></div>
    <h2 id="plansHead" style="display:none">Plans (click to jump)</h2><div class="plans" id="plans"></div>
    <h2>Log</h2><pre id="log"></pre>
    <h2>Unit symbols</h2><div id="symbols" class="muted"></div>
  </aside>
</main>
<script>
const $ = id => document.getElementById(id);
const c = $('c'), ctx = c.getContext('2d');
let mode = 'live', live = null, rep = null, T = 0, playing = false, view = null, lastFrame = 0;

// ------------------------------------------------------------ data
async function pollLive() {
  if (mode === 'live') {
    try { live = await (await fetch('/data', {cache:'no-store'})).json(); buildLive(); } catch (e) {}
  }
  setTimeout(pollLive, 500);
}
async function loadBattles() {
  try {
    const list = await (await fetch('/battles', {cache:'no-store'})).json();
    const sel = $('pick'), keep = sel.value;
    sel.innerHTML = '<option value="">History…</option>' + list.map(b =>
      `<option value="${b.id}">${b.id.replace(/^(\d{4})(\d\d)(\d\d)-(\d\d)(\d\d)(\d\d)$/, '$3.$2 $4:$5')} · ${b.plans} plans · ${b.size_kb} KB</option>`).join('');
    sel.value = keep;
  } catch (e) {}
}
function buildLive() {
  if (!live || !live.battle) { view = null; render(); return; }
  view = { title: `Live: battle ${live.battle}`,
    sub: `t=${(live.t||0).toFixed(0)}s · phase ${live.phase||'?'} · AI alliance ${live.ai} · ${live.general||''} · plans ${live.plans||0}`,
    units: live.units || [], plan: live.plan, orders: live.orders || [], log: (live.log || []).slice().reverse(),
    buildings: live.buildings || [] };
  render();
}
async function openReplay(id) {
  rep = await (await fetch('/replay?id=' + encodeURIComponent(id), {cache:'no-store'})).json();
  mode = 'replay'; $('bLive').classList.remove('on'); $('timeline').style.display = 'flex';
  $('slider').max = rep.frames.length ? Math.floor(rep.frames[rep.frames.length - 1].t) : 0;
  $('plansHead').style.display = ''; $('reportBox').style.display = '';
  $('plans').innerHTML = rep.plans.map((p, i) => `<div data-i="${i}"><span class="t">${p.t.toFixed(0)}s</span>${esc(p.plan.intent)}</div>`).join('');
  T = rep.frames.length ? rep.frames[0].t : 0; playing = false; $('bPlay').textContent = '▶';
  buildReplay();
}
function buildReplay() {
  if (!rep) return;
  const fr = rep.frames; let lo = 0, hi = fr.length - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (fr[m].t <= T) lo = m; else hi = m - 1; }
  const f = fr[lo] || {u: [], t: 0};
  const units = f.u.map(([id, x, y, h, w, men, fl, z]) => ({id, x, y, h, w, men, z, rout: !!(fl & 1), ctl: !!(fl & 2), gar: !!(fl & 4), ...(rep.units[id] || {})}));
  // fortifications as of time T: static list + the latest state update at or before T
  const bstate = {};
  for (const s of rep.bstates || []) { if (s.t > T) break; for (const [id, hp, owner, gar] of s.b) bstate[id] = {hp, owner, gar}; }
  const buildings = (rep.buildings || []).map(b => {
    const s = bstate[b.id]; if (!s) return b;
    return {...b, hp: s.hp, gar: !!s.gar, side: s.owner === rep.ai ? 'ai' : s.owner ? 'pl' : ''};
  });
  let pi = -1; rep.plans.forEach((p, i) => { if (p.t <= T) pi = i; });
  const plan = pi >= 0 ? rep.plans[pi] : null;
  const orders = []; for (const o of rep.orders) if (o.t <= T && o.t > T - 2) orders.push(...o.orders);
  const log = [];
  for (const e of rep.events) if (e.t <= T) log.push(`t=${e.t.toFixed(0)}s ${e.name}`);
  for (const p of rep.plans) if (p.t <= T) log.push(`t=${p.t.toFixed(0)}s plan: ${p.plan.intent}`);
  log.sort((a, b) => parseFloat(b.slice(2)) - parseFloat(a.slice(2)));
  view = { title: `Replay: battle ${rep.battle}`,
    sub: `phase ${f.phase||'?'} · AI alliance ${rep.ai} · ${rep.plans.length} plans` + (plan && plan.info ? ` · this plan took ${plan.info.seconds}s` : ''),
    units, buildings, plan: plan && plan.plan, orders, log, report: plan ? ((plan.problems||[]).length ? 'PROBLEMS:\n' + plan.problems.join('\n') + '\n\n' : '') + (plan.report || '') : '' };
  $('slider').value = Math.floor(T); $('tlabel').textContent = `${T.toFixed(0)}s`;
  document.querySelectorAll('#plans div').forEach(d => d.classList.toggle('cur', +d.dataset.i === pi));
  render();
}

// ------------------------------------------------------------ drawing
let fit = null;
function render() {
  const dpr = window.devicePixelRatio || 1, W = c.clientWidth, H = c.clientHeight;
  c.width = W * dpr; c.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (!view) { $('title').textContent = 'Waiting for a battle…'; return; }
  $('title').textContent = view.title; $('sub').textContent = view.sub;
  const plan = view.plan;
  $('intent').textContent = plan ? plan.intent : '–';
  $('reasoning').textContent = plan ? plan.reasoning : '–';
  $('groups').innerHTML = plan ? plan.groups.map(g =>
    `<li><b>${esc(g.name)}</b> ${g.units.length} units · ${esc(g.task)}${g.target ? ' ' + esc(g.target) : ''}${g.building != null ? ' b' + esc(g.building) : ''}` +
    `${g.position ? ' @' + g.position.map(v => (+v).toFixed(0)).join(',') : ''}` +
    `${g.engage_within_m ? ' · engage ' + esc(g.engage_within_m) + 'm' : ''}${g.keep_range_m ? ' · keep ' + esc(g.keep_range_m) + 'm' : ''}</li>`).join('') : '';
  if (view.report !== undefined) $('report').textContent = view.report || '–';
  $('log').textContent = view.log.join('\n');

  const units = view.units;
  if (!units.length) return;
  // fit: in a replay keep the whole battle's extent so the map does not jump around
  let ext = mode === 'replay' && rep ? rep._ext : null;
  if (mode === 'replay' && rep && !ext) {
    let a = [Infinity, -Infinity, Infinity, -Infinity];
    for (const f of rep.frames) for (const u of f.u) { a[0] = Math.min(a[0], u[1]); a[1] = Math.max(a[1], u[1]); a[2] = Math.min(a[2], u[2]); a[3] = Math.max(a[3], u[2]); }
    ext = rep._ext = a;
  }
  if (!ext) { ext = [Infinity, -Infinity, Infinity, -Infinity]; for (const u of units) { ext[0] = Math.min(ext[0], u.x); ext[1] = Math.max(ext[1], u.x); ext[2] = Math.min(ext[2], u.y); ext[3] = Math.max(ext[3], u.y); } }
  const pad = 80, s = Math.min(W / (ext[1] - ext[0] + 2 * pad), H / (ext[3] - ext[2] + 2 * pad));
  const cx = (ext[0] + ext[1]) / 2, cy = (ext[2] + ext[3]) / 2;
  const P = (x, y) => [W / 2 + (x - cx) * s, H / 2 - (y - cy) * s];
  fit = {P, s, units};

  ctx.strokeStyle = '#22262d'; ctx.lineWidth = 1;
  for (let gx = Math.floor((cx - W / 2 / s) / 100) * 100; gx < cx + W / 2 / s; gx += 100) { const [px] = P(gx, 0); ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, H); ctx.stroke(); }
  for (let gy = Math.floor((cy - H / 2 / s) / 100) * 100; gy < cy + H / 2 / s; gy += 100) { const [, py] = P(0, gy); ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(W, py); ctx.stroke(); }

  const col = {ai: getVar('--ai'), pl: getVar('--pl'), plan: getVar('--plan')};
  // buildings under everything else: scenery as faint dots, fortifications as squares by kind and owner
  const SIZE = {wall: 6, tower: 13, gate: 15, keep: 24, building: 9};
  const sideCol = sd => sd === 'ai' ? col.ai : sd === 'pl' ? col.pl : '#7a7568';
  // wall lines: the game gives each wall section, tower and gate as a point. Per castle level (altitude),
  // order the pieces around the level's centre and join neighbours: that redraws the defensive ring.
  const ringPieces = (view.buildings || []).filter(b => ['wall', 'tower', 'gate'].includes(b.kind));
  const levels = {};
  for (const b of ringPieces) { const k = Math.round((b.z || 0) / 4); (levels[k] = levels[k] || []).push(b); }
  for (const pieces of Object.values(levels)) {
    if (pieces.length < 3) continue;
    const mx = pieces.reduce((a, b) => a + b.x, 0) / pieces.length, my = pieces.reduce((a, b) => a + b.y, 0) / pieces.length;
    pieces.sort((a, b) => Math.atan2(a.y - my, a.x - mx) - Math.atan2(b.y - my, b.x - mx));
    const spacing = pieces.map((b, i) => Math.hypot(b.x - pieces[(i + 1) % pieces.length].x, b.y - pieces[(i + 1) % pieces.length].y))
      .sort((a, b) => a - b);
    const maxGap = Math.max(25, spacing[Math.floor(spacing.length * 0.75)] * 2.2);  // don't bridge real gaps
    ctx.lineCap = 'round';
    for (let i = 0; i < pieces.length; i++) {
      const a = pieces[i], b = pieces[(i + 1) % pieces.length];
      if (Math.hypot(a.x - b.x, a.y - b.y) > maxGap) continue;
      const [ax, ay] = P(a.x, a.y), [bx, by] = P(b.x, b.y);
      const hp = Math.min(typeof a.hp === 'number' ? a.hp : 1, typeof b.hp === 'number' ? b.hp : 1);
      ctx.globalAlpha = 0.35 + 0.65 * Math.max(0.15, Math.min(1, hp));
      ctx.strokeStyle = sideCol(a.side === b.side ? a.side : '');
      ctx.lineWidth = Math.max(3, 4 * s);
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    }
    ctx.globalAlpha = 1; ctx.lineCap = 'butt';
  }
  for (const b of view.buildings || []) {
    const [px, py] = P(b.x, b.y);
    if (px < -40 || py < -40 || px > W + 40 || py > H + 40) continue;
    if (b.kind === 'scenery') { ctx.fillStyle = '#3a3a3a'; ctx.fillRect(px - 2, py - 2, 4, 4); continue; }
    const sz = Math.max(5, (SIZE[b.kind] || 9) * s);
    const hp = typeof b.hp === 'number' ? Math.max(0.15, Math.min(1, b.hp)) : 1;
    ctx.globalAlpha = 0.35 + 0.65 * hp;
    ctx.fillStyle = b.gar ? sideCol(b.side) : '#2c2a26';
    ctx.fillRect(px - sz / 2, py - sz / 2, sz, sz);
    ctx.strokeStyle = sideCol(b.side); ctx.lineWidth = b.kind === 'wall' ? 1.5 : 2.5;
    ctx.strokeRect(px - sz / 2, py - sz / 2, sz, sz);
    ctx.globalAlpha = 1;
    if (b.kind !== 'wall') {
      ctx.fillStyle = '#d8d2c4'; ctx.font = 'bold 10px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText({gate: 'G', tower: 'T', keep: 'K'}[b.kind] || '', px, py);
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = '#9a968c'; ctx.font = '9px system-ui'; ctx.fillText('b' + b.id, px + sz / 2 + 2, py - sz / 2);
    }
  }
  fit.buildings = view.buildings || [];

  const byId = Object.fromEntries(units.map(u => [u.id, u]));
  for (const o of view.orders) {
    const u = byId[o.unit]; if (!u) continue;
    let tx, ty;
    const bld = o.building != null ? (view.buildings || []).find(b => b.id === o.building) : null;
    if (o.cmd === 'attack' && byId[o.target]) { tx = byId[o.target].x; ty = byId[o.target].y; }
    else if ((o.cmd === 'move' || o.cmd === 'occupy') && o.x != null) { tx = o.x; ty = o.y; }
    else if (bld) { tx = bld.x; ty = bld.y; } else continue;
    const hostile = o.cmd === 'attack' || o.cmd === 'attack_building' || o.cmd === 'climb';
    arrow(P(u.x, u.y), P(tx, ty), hostile ? 'rgba(208,80,60,.85)' : 'rgba(232,193,90,.85)');
  }
  if (plan) for (const g of plan.groups) if (g.position) {
    const [px, py] = P(g.position[0], g.position[1]);
    ctx.strokeStyle = 'rgba(232,193,90,.6)'; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.arc(px, py, 10, 0, 7); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(232,193,90,.9)'; ctx.font = '11px system-ui'; ctx.fillText(g.name, px + 12, py - 8);
  }
  for (const u of units) {
    const [px, py] = P(u.x, u.y);
    const w = Math.max(6, (u.w || 30) * s), d = Math.max(4, 8 * s + 3);
    ctx.save(); ctx.translate(px, py); ctx.rotate((u.h || 0) * Math.PI / 180);
    ctx.globalAlpha = u.rout ? 0.35 : 1;
    ctx.fillStyle = u.ai ? col.ai : col.pl; ctx.fillRect(-w / 2, -d / 2, w, d);
    ctx.fillStyle = '#fff'; ctx.fillRect(-w / 2, -d / 2, w, 2);
    if (u.ctl) { ctx.strokeStyle = col.plan; ctx.lineWidth = 1.5; ctx.strokeRect(-w / 2 - 2, -d / 2 - 2, w + 4, d + 4); }
    ctx.restore();
    // class icon, kept upright, centred on the unit
    const cls = classify(u), fs = Math.round(Math.max(11, Math.min(18, 10 * s + 8)));
    ctx.font = `bold ${fs}px system-ui, "Segoe UI Symbol", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 3; ctx.strokeStyle = '#000a'; ctx.strokeText(cls.icon, px, py);
    ctx.fillStyle = u.gen ? col.plan : '#fff'; ctx.fillText(cls.icon, px, py);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.globalAlpha = 1;
    ctx.fillStyle = '#cfcabe'; ctx.font = '10px system-ui';
    ctx.fillText(`${u.id % 10000} · ${u.men}`, px + Math.max(w / 2, fs * .7) + 3, py + 3);
  }
}
function arrow([ax, ay], [bx, by], colr) {
  ctx.strokeStyle = colr; ctx.fillStyle = colr; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
  const a = Math.atan2(by - ay, bx - ax);
  ctx.beginPath(); ctx.moveTo(bx, by);
  ctx.lineTo(bx - 8 * Math.cos(a - .4), by - 8 * Math.sin(a - .4)); ctx.lineTo(bx - 8 * Math.cos(a + .4), by - 8 * Math.sin(a + .4)); ctx.fill();
}
const getVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = s => String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const pretty = t => String(t || '?').replace(/^(Genpei|Boshin|Sho|Mon|FotS|Shogun|Rok)_/, '').replace(/_/g, ' ');

// unit class from the game's type key (e.g. Inf_Spear_Yari_Ashigaru, Cav_Missile_Bow_Ki, Gen_Tokugawa_Ieyasu)
const CLASSES = [
  ['general', '★', 'general'],
  ['art', '◉', 'artillery'],
  ['inf_spear', '↑', 'spears (yari, pikes)'],
  ['inf_pole', '⇑', 'polearms (naginata)'],
  ['inf_sword', '✕', 'swords, clubs (katana, no-dachi, monks)'],
  ['inf_bow', ')', 'bows'],
  ['inf_gun', '•', 'guns (matchlocks, rifles)'],
  ['cav_sword', '/', 'cavalry (sword)'],
  ['cav_spear', '/↑', 'cavalry (spear)'],
  ['cav_bow', '/)', 'horse archers'],
  ['cav_gun', '/•', 'mounted guns'],
  ['inf', '■', 'other infantry'],
];
const CLASS_BY_KEY = Object.fromEntries(CLASSES.map(([k, icon, name]) => [k, {key: k, icon, name}]));
function classify(u) {
  const t = String(u.type || '');
  if (u.gen) return CLASS_BY_KEY.general;
  if (u.kind === 'art' || /Art|Cannon|Mortar|Gatling|Artillery|Rocket/i.test(t)) return CLASS_BY_KEY.art;
  const gun = /Matchlock|Rifle|Musket|Gun|Carbine|Pistol|Marines|Line_Inf|Revolver|Shotgun/i.test(t);
  const bow = /Bow|Archer/i.test(t);
  const missile = u.missile || gun || bow;
  if (u.kind === 'cav' || /(^|_)Cav(_|$)|Cavalry/i.test(t)) {
    if (missile) return gun ? CLASS_BY_KEY.cav_gun : CLASS_BY_KEY.cav_bow;
    return /Spear|Yari|Lance|Naginata/i.test(t) ? CLASS_BY_KEY.cav_spear : CLASS_BY_KEY.cav_sword;
  }
  if (missile) return gun ? CLASS_BY_KEY.inf_gun : CLASS_BY_KEY.inf_bow;
  if (/Naginata|Halberd|Glaive/i.test(t)) return CLASS_BY_KEY.inf_pole;
  if (/Spear|Yari|Pike/i.test(t)) return CLASS_BY_KEY.inf_spear;
  if (/Sword|Katana|Dachi|Tetsubo|Monk|Club|Kensai|Ninja/i.test(t)) return CLASS_BY_KEY.inf_sword;
  return CLASS_BY_KEY.inf;
}

// ------------------------------------------------------------ interaction
c.addEventListener('mousemove', ev => {
  const tip = $('tip');
  if (!fit) { tip.style.display = 'none'; return; }
  const r = c.getBoundingClientRect(), mx = ev.clientX - r.left, my = ev.clientY - r.top;
  let best = null, bd = 14;
  for (const u of fit.units) { const [px, py] = fit.P(u.x, u.y); const d = Math.hypot(px - mx, py - my); if (d < bd) { bd = d; best = u; } }
  if (!best) {
    let bb = null, bbd = 10;
    for (const b of fit.buildings || []) { if (b.kind === 'scenery') continue; const [px, py] = fit.P(b.x, b.y); const d = Math.hypot(px - mx, py - my); if (d < bbd) { bbd = d; bb = b; } }
    if (!bb) { tip.style.display = 'none'; return; }
    tip.innerHTML = `<b>b${bb.id}</b> ${esc(bb.kind)} · ${esc(bb.name || '')}<br>${bb.side === 'ai' ? 'AI' : bb.side === 'pl' ? 'player' : 'nobody'} · holds ${bb.cap || 0} men · alt ${bb.z} m` +
      `${typeof bb.hp === 'number' ? ' · health ' + Math.round(bb.hp * 100) + '%' : ''}${bb.gar ? ' · garrisoned' : ''}`;
    tip.style.display = 'block'; tip.style.left = (mx + 14) + 'px'; tip.style.top = (my + 10) + 'px';
    return;
  }
  tip.innerHTML = `<b>${best.id}</b> ${esc(pretty(best.type))}<br>${classify(best).icon} ${classify(best).name}<br>${best.ai ? 'AI' : 'player'} · ${best.men}${best.men0 ? '/' + best.men0 : ''} men · facing ${best.h}°${best.z != null ? ' · alt ' + best.z + ' m' : ''}${best.gar ? ' · garrisoned' : ''}${best.rout ? ' · ROUTING' : ''}${best.ctl ? ' · controlled' : ''}`;
  tip.style.display = 'block'; tip.style.left = (mx + 14) + 'px'; tip.style.top = (my + 10) + 'px';
});
c.addEventListener('mouseleave', () => $('tip').style.display = 'none');
$('bLive').onclick = () => { mode = 'live'; rep = null; playing = false; $('bLive').classList.add('on'); $('pick').value = '';
  $('timeline').style.display = 'none'; $('plansHead').style.display = 'none'; $('reportBox').style.display = 'none'; $('plans').innerHTML = ''; buildLive(); };
$('pick').onchange = e => { if (e.target.value) openReplay(e.target.value); else $('bLive').onclick(); };
$('pick').onfocus = loadBattles;
$('slider').oninput = e => { T = +e.target.value; buildReplay(); };
$('bPlay').onclick = () => { playing = !playing; $('bPlay').textContent = playing ? '❚❚' : '▶'; lastFrame = performance.now(); };
$('plans').onclick = e => { const d = e.target.closest('[data-i]'); if (d) { T = rep.plans[+d.dataset.i].t; buildReplay(); } };
function loop(now) {
  if (mode === 'replay' && playing && rep && rep.frames.length) {
    T += (now - lastFrame) / 1000 * +$('speed').value;
    const end = rep.frames[rep.frames.length - 1].t;
    if (T >= end) { T = end; playing = false; $('bPlay').textContent = '▶'; }
    buildReplay();
  }
  lastFrame = now; requestAnimationFrame(loop);
}
window.addEventListener('resize', render);
$('symbols').innerHTML = CLASSES.map(([, icon, name]) =>
  `<div><b style="display:inline-block;width:26px;color:var(--ink)">${icon}</b>${name}</div>`).join('') +
  '<div style="margin-top:4px">box = unit frontage, white edge = its front</div>' +
  '<div style="margin-top:6px">squares = fortifications: G gate, T tower, K keep, plain = wall; ' +
  'outline = owner, filled = garrisoned, faded = damaged; grey dots = other buildings</div>';
loadBattles(); pollLive(); requestAnimationFrame(loop);
</script>
</body>
</html>
